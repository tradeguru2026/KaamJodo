<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hey Karigar - Karigar Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f6;
      color: #17221c;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .top-box {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
    }

    .top-box h2 {
      margin-bottom: 8px;
    }

    .refresh {
      margin-top: 12px;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .request {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
    }

    .request h3 {
      margin-bottom: 12px;
      color: #087f5b;
    }

    .row {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .label {
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
      font-weight: bold;
      margin-top: 5px;
    }

    .status.Accepted {
      background: #d7f5e5;
      color: #176b3a;
    }

    .status.Assigned {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status.Completed {
      background: #dcfce7;
      color: #166534;
    }

    .status.Cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 130px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .accept {
      background: #087f5b;
    }

    .reject {
      background: #d64545;
    }

    .assign {
      background: #2563eb;
    }

    .complete {
      background: #16a34a;
    }

    .empty {
      background: white;
      padding: 30px 18px;
      border-radius: 16px;
      text-align: center;
      color: #777;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      background: #e7f8ef;
      color: #176b3a;
    }

    footer {
      text-align: center;
      padding: 28px 10px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>🛠️ Hey Karigar</h1>
  <p>Karigar Dashboard</p>
</header>

<main class="container">

  <div class="top-box">
    <h2>📋 Customer Requests</h2>
    <p>Yahan customers ki service requests dikhengi.</p>

    <button class="refresh" onclick="loadRequests()">
      🔄 Requests Refresh Karein
    </button>
  </div>

  <div class="message" id="message"></div>

  <div id="requests"></div>

</main>

<footer>
  © 2026 Hey Karigar · Karigar Dashboard
</footer>

<script>

const API_BASE = window.location.origin;

async function loadRequests() {

  const container = document.getElementById("requests");

  container.innerHTML = `
    <div class="empty">
      ⏳ Requests load ho rahi hain...
    </div>
  `;

  try {

    const response = await fetch(
      API_BASE + "/api/requests"
    );

    const data = await response.json();

    if (!data.success) {
      throw new Error("Requests load nahi hui");
    }

    if (!data.requests || data.requests.length === 0) {

      container.innerHTML = `
        <div class="empty">
          📭 Abhi koi customer request nahi hai.
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    data.requests
      .slice()
      .reverse()
      .forEach(request => {

        const card = document.createElement("div");

        card.className = "request";

        let actionButtons = "";

        // NEW REQUEST
        if (request.status === "New") {

          actionButtons = `
            <div class="buttons">

              <button
                class="btn accept"
                onclick="updateStatus(${request.id}, 'Accepted')"
              >
                ✅ Accept
              </button>

              <button
                class="btn reject"
                onclick="updateStatus(${request.id}, 'Cancelled')"
              >
                ❌ Reject
              </button>

            </div>
          `;
        }

        // ACCEPTED REQUEST
        else if (request.status === "Accepted") {

          actionButtons = `
            <div class="buttons">

              <button
                class="btn assign"
                onclick="updateStatus(${request.id}, 'Assigned')"
              >
                👷 Assign / Kaam Start
              </button>

              <button
                class="btn reject"
                onclick="updateStatus(${request.id}, 'Cancelled')"
              >
                ❌ Cancel
              </button>

            </div>
          `;
        }

        // ASSIGNED REQUEST
        else if (request.status === "Assigned") {

          actionButtons = `
            <div class="buttons">

              <button
                class="btn complete"
                onclick="updateStatus(${request.id}, 'Completed')"
              >
                ✅ Kaam Complete
              </button>

              <button
                class="btn reject"
                onclick="updateStatus(${request.id}, 'Cancelled')"
              >
                ❌ Cancel
              </button>

            </div>
          `;
        }

        card.innerHTML = `
          <h3>🛠️ ${escapeHtml(request.service)}</h3>

          <div class="row">
            <span class="label">👤 Naam:</span>
            ${escapeHtml(request.name)}
          </div>

          <div class="row">
            <span class="label">📞 Mobile:</span>
            ${escapeHtml(request.phone)}
          </div>

          <div class="row">
            <span class="label">📍 Area:</span>
            ${escapeHtml(request.location)}
          </div>

          <div class="row">
            <span class="label">📝 Kaam:</span>
            ${escapeHtml(request.details || "Details nahi di gayi")}
          </div>

          <div class="row">
            <span class="label">Status:</span><br>

            <span class="status ${escapeHtml(request.status)}">
              ${getStatusIcon(request.status)}
              ${escapeHtml(request.status)}
            </span>
          </div>

          ${actionButtons}
        `;

        container.appendChild(card);

      });

  } catch (error) {

    container.innerHTML = `
      <div class="empty">
        ❌ Requests load karne mein problem hui.
        <br><br>
        Please Refresh karein.
      </div>
    `;
  }
}


async function updateStatus(id, status) {

  try {

    const response = await fetch(
      API_BASE + "/api/requests/" + id + "/status",
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          status: status
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message || "Status update failed"
      );
    }

    let message = "";

    if (status === "Accepted") {
      message = "✅ Request accept ho gayi!";
    }

    else if (status === "Assigned") {
      message = "👷 Request assigned ho gayi!";
    }

    else if (status === "Completed") {
      message = "🎉 Kaam completed mark ho gaya!";
    }

    else if (status === "Cancelled") {
      message = "❌ Request cancel ho gayi!";
    }

    showMessage(message);

    loadRequests();

  } catch (error) {

    showMessage(
      "❌ Status update nahi ho saka."
    );
  }
}


function getStatusIcon(status) {

  if (status === "New") {
    return "🆕";
  }

  if (status === "Accepted") {
    return "✅";
  }

  if (status === "Assigned") {
    return "👷";
  }

  if (status === "Completed") {
    return "🎉";
  }

  if (status === "Cancelled") {
    return "❌";
  }

  return "📌";
}


function showMessage(text) {

  const message =
    document.getElementById("message");

  message.innerText = text;
  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 3000);
}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


loadRequests();

</script>

</body>
</html>
