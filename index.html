<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Karigar</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f6;
  color:#17221c;
}

header{
  background:#087f5b;
  color:white;
  padding:18px 15px;
  text-align:center;
}

header h1{
  font-size:26px;
}

header p{
  margin-top:5px;
  font-size:14px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
  margin-bottom:14px;
  color:#087f5b;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 16px;
  margin:5px 3px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

.primary{
  background:#087f5b;
  color:white;
}

.secondary{
  background:#e8f5f0;
  color:#087f5b;
}

.danger{
  background:#dc3545;
  color:white;
}

.warning{
  background:#ffc107;
  color:#222;
}

.success{
  background:#198754;
  color:white;
}

.hidden{
  display:none !important;
}

.message{
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  background:#eef8f4;
}

.error{
  background:#ffecec;
  color:#a00000;
}

.service-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.service-btn{
  background:#f0f7f4;
  color:#087f5b;
  border:1px solid #cde6dc;
  min-height:48px;
}

.service-btn.selected{
  background:#087f5b;
  color:white;
}

.profile-box{
  background:#e8f5f0;
  padding:12px;
  border-radius:10px;
  line-height:1.7;
}

.request{
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin:10px 0;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e8f5f0;
  color:#087f5b;
  font-weight:bold;
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:#f0f7f4;
  padding:12px 5px;
  text-align:center;
  border-radius:10px;
}

.stat strong{
  display:block;
  font-size:20px;
  color:#087f5b;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🛠️ Hey Karigar</h1>
  <p>Apne ghar ke har kaam ke liye karigar ek jagah</p>
</header>

<div class="container">

<div id="authSection" class="card">

  <h2>🔐 Account</h2>

  <div id="authMessage" class="message hidden"></div>

  <input id="name" type="text" placeholder="Aapka naam">

  <input id="phone" type="tel" placeholder="Mobile Number">

  <input id="email" type="email" placeholder="Email (optional)">

  <input id="password" type="password" placeholder="Password (minimum 6 characters)">

  <select id="role">
    <option value="customer">Customer</option>
    <option value="karigar">Karigar</option>
  </select>

  <div id="karigarServiceBox" class="hidden">

    <input
      id="karigarService"
      type="text"
      placeholder="Aap kaun sa kaam karte hain? e.g. Plumber"
    >

  </div>

  <button class="primary" onclick="signup()">
    📝 Signup
  </button>

  <button class="secondary" onclick="login()">
    🔑 Login
  </button>

  <p style="font-size:13px;color:#666;margin-top:8px;">
    Login ke liye Mobile Number + Password use karein.
  </p>

</div>


<div id="userSection" class="card hidden">

  <h2>👤 My Profile</h2>

  <div id="profileBox" class="profile-box"></div>

  <button class="secondary" onclick="getCurrentLocation()">
    📍 Location Update Karein
  </button>

  <button class="danger" onclick="logout()">
    Logout
  </button>

</div>


<div id="customerSection" class="card hidden">

  <h2>🔧 Service Request</h2>

  <div id="requestMessage" class="message hidden"></div>

  <p style="margin-bottom:10px;">
    Apko kis kaam ke liye karigar chahiye?
  </p>

  <div class="service-grid">

    <button class="service-btn" onclick="selectService(this,'Plumber')">
      🚰 Plumber
    </button>

    <button class="service-btn" onclick="selectService(this,'Electrician')">
      ⚡ Electrician
    </button>

    <button class="service-btn" onclick="selectService(this,'Carpenter')">
      🪚 Carpenter
    </button>

    <button class="service-btn" onclick="selectService(this,'Painter')">
      🎨 Painter
    </button>

    <button class="service-btn" onclick="selectService(this,'AC Repair')">
      ❄️ AC Repair
    </button>

    <button class="service-btn" onclick="selectService(this,'Washing Machine Repair')">
      🧺 Washing Machine
    </button>

    <button class="service-btn" onclick="selectService(this,'TV Repair')">
      📺 TV Repair
    </button>

    <button class="service-btn" onclick="selectService(this,'Gardener/Mali')">
      🌱 Gardener/Mali
    </button>

    <button class="service-btn" onclick="selectService(this,'Generator Mechanic')">
      ⚙️ Generator Mechanic
    </button>

    <button class="service-btn" onclick="selectService(this,'Puncture/Tyre Replacement')">
      🛞 Puncture/Tyre
    </button>

    <button class="service-btn" onclick="selectService(this,'Barber')">
      💈 Barber
    </button>

    <button class="service-btn" onclick="selectService(this,'Physiotherapist')">
      🧑‍⚕️ Physiotherapist
    </button>

    <button class="service-btn" onclick="selectService(this,'Mehndi Artist')">
      🌿 Mehndi Artist
    </button>

    <button class="service-btn" onclick="selectService(this,'Carpet Cleaning')">
      🧹 Carpet Cleaning
    </button>

    <button class="service-btn" onclick="selectService(this,'Gutter Cleaning')">
      🧽 Gutter Cleaning
    </button>

    <button class="service-btn" onclick="selectService(this,'Home Cleaning')">
      🏠 Home Cleaning
    </button>

    <button class="service-btn" onclick="selectService(this,'Other')">
      ➕ Other
    </button>

  </div>

  <input id="requestAddress" type="text" placeholder="Address / Area">

  <textarea
    id="requestDescription"
    placeholder="Problem ke baare mein batayein"
  ></textarea>

  <button class="primary" onclick="createRequest()">
    📩 Request Bhejein
  </button>

  <button class="secondary" onclick="getCurrentLocation()">
    📍 Current Location
  </button>

</div>


<div id="customerRequestsSection" class="card hidden">

  <h2>📋 Meri Requests</h2>

  <div id="customerRequests"></div>

</div>


<div id="karigarSection" class="card hidden">

  <h2>🛠️ Karigar Dashboard</h2>

  <div class="stats">

    <div class="stat">
      <strong id="totalRequests">0</strong>
      Total
    </div>

    <div class="stat">
      <strong id="newRequests">0</strong>
      New
    </div>

    <div class="stat">
      <strong id="completedRequests">0</strong>
      Completed
    </div>

  </div>

  <div id="karigarMessage" class="message hidden"></div>

  <div id="requestsList"></div>

</div>

</div>


<footer>
  © 2026 Hey Karigar
</footer>


<script>

const API_BASE = window.location.origin;

let currentUser = null;
let selectedService = "";


/* =====================================================
   AUTH TOKEN
===================================================== */

function getToken(){

  return localStorage.getItem("heyKarigarToken") || "";

}


function authHeaders(){

  const token = getToken();

  return {
    "Content-Type":"application/json",
    "Authorization":"Bearer " + token
  };

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(id,message,error=false){

  const el=document.getElementById(id);

  if(!el){
    return;
  }

  el.textContent=message;

  el.classList.remove("hidden","error");

  if(error){
    el.classList.add("error");
  }

}


/* =====================================================
   ROLE CHANGE
===================================================== */

document
  .getElementById("role")
  .addEventListener("change",function(){

    const box=
      document.getElementById("karigarServiceBox");

    if(this.value==="karigar"){
      box.classList.remove("hidden");
    }else{
      box.classList.add("hidden");
    }

  });


/* =====================================================
   SIGNUP
===================================================== */

async function signup(){

  const name=
    document.getElementById("name").value.trim();

  const phone=
    document.getElementById("phone").value.trim();

  const email=
    document.getElementById("email").value.trim();

  const password=
    document.getElementById("password").value;

  const role=
    document.getElementById("role").value;

  const service=
    document.getElementById("karigarService").value.trim();


  if(!name){
    showMessage("authMessage","Naam zaroori hai",true);
    return;
  }

  if(!phone){
    showMessage("authMessage","Mobile number zaroori hai",true);
    return;
  }

  if(!password){
    showMessage("authMessage","Password zaroori hai",true);
    return;
  }

  if(password.length < 6){
    showMessage(
      "authMessage",
      "Password kam se kam 6 characters ka hona chahiye",
      true
    );
    return;
  }

  if(role==="karigar" && !service){
    showMessage(
      "authMessage",
      "Karigar ka kaam/service likhein",
      true
    );
    return;
  }

  showMessage(
    "authMessage",
    "Account create ho raha hai..."
  );


  try{

    const response=
      await fetch(
        API_BASE+"/api/auth/signup",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            name:name,
            full_name:name,
            phone:phone,
            email:email || null,
            password:password,
            role:role,
            service:service || null

          })

        }
      );


    const data=
      await response.json();


    if(!response.ok || !data.success){

      showMessage(
        "authMessage",
        data.message || "Signup failed",
        true
      );

      return;
    }


    showMessage(
      "authMessage",
      "✅ Account ban gaya! Ab Mobile Number + Password se Login karein."
    );


    document.getElementById("password").value="";


  }catch(error){

    console.error(error);

    showMessage(
      "authMessage",
      "Server se connection nahi ho raha.",
      true
    );

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const phone=
    document.getElementById("phone").value.trim();

  const password=
    document.getElementById("password").value;


  if(!phone){
    showMessage(
      "authMessage",
      "Mobile number enter karein",
      true
    );
    return;
  }


  if(!password){
    showMessage(
      "authMessage",
      "Password enter karein",
      true
    );
    return;
  }


  showMessage(
    "authMessage",
    "Login ho raha hai..."
  );


  try{

    const response=
      await fetch(
        API_BASE+"/api/auth/login",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            phone:phone,
            password:password
          })

        }
      );


    const data=
      await response.json();


    if(!response.ok || !data.success){

      showMessage(
        "authMessage",
        data.message || "Login failed",
        true
      );

      return;
    }


    currentUser=data.profile;


    localStorage.setItem(
      "heyKarigarProfile",
      JSON.stringify(data.profile)
    );


    localStorage.setItem(
      "heyKarigarToken",
      data.access_token || ""
    );


    localStorage.setItem(
      "heyKarigarRefreshToken",
      data.refresh_token || ""
    );


    showLoggedInUser();


  }catch(error){

    console.error(error);

    showMessage(
      "authMessage",
      "Server se connection nahi ho raha.",
      true
    );

  }

}


/* =====================================================
   SHOW LOGGED IN USER
===================================================== */

function showLoggedInUser(){

  if(!currentUser){
    return;
  }


  document
    .getElementById("authSection")
    .classList.add("hidden");


  document
    .getElementById("userSection")
    .classList.remove("hidden");


  document
    .getElementById("profileBox")
    .innerHTML=`

      <b>Naam:</b>
      ${escapeHtml(
        currentUser.name ||
        currentUser.full_name ||
        "Nahi diya"
      )}
      <br>

      <b>Mobile:</b>
      ${escapeHtml(
        currentUser.phone ||
        "Nahi diya"
      )}
      <br>

      <b>Email:</b>
      ${escapeHtml(
        currentUser.email ||
        "Nahi diya"
      )}
      <br>

      <b>Role:</b>
      ${
        currentUser.role==="karigar"
        ? "🛠️ Karigar"
        : "👤 Customer"
      }
      <br>

      <b>Service:</b>
      ${escapeHtml(
        currentUser.service || "—"
      )}
      <br>

      <b>Location:</b>
      ${escapeHtml(
        currentUser.location ||
        "Location update karein"
      )}

  `;


  if(currentUser.role==="karigar"){

    document
      .getElementById("karigarSection")
      .classList.remove("hidden");

    document
      .getElementById("customerSection")
      .classList.add("hidden");

    document
      .getElementById("customerRequestsSection")
      .classList.add("hidden");

    loadRequests();

  }else{

    document
      .getElementById("customerSection")
      .classList.remove("hidden");

    document
      .getElementById("customerRequestsSection")
      .classList.remove("hidden");

    document
      .getElementById("karigarSection")
      .classList.add("hidden");

    loadCustomerRequests();

  }

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  currentUser=null;

  localStorage.removeItem("heyKarigarProfile");
  localStorage.removeItem("heyKarigarToken");
  localStorage.removeItem("heyKarigarRefreshToken");

  location.reload();

}


/* =====================================================
   SELECT SERVICE
===================================================== */

function selectService(button,service){

  document
    .querySelectorAll(".service-btn")
    .forEach(
      btn=>btn.classList.remove("selected")
    );

  button.classList.add("selected");

  selectedService=service;

}


/* =====================================================
   CREATE REQUEST
===================================================== */

async function createRequest(){

  if(!currentUser){

    showMessage(
      "requestMessage",
      "Pehle login karein",
      true
    );

    return;
  }


  if(!getToken()){

    showMessage(
      "requestMessage",
      "Session expire ho gaya. Dobara login karein.",
      true
    );

    return;
  }


  if(!selectedService){

    showMessage(
      "requestMessage",
      "Pehle service select karein",
      true
    );

    return;
  }


  const address=
    document
      .getElementById("requestAddress")
      .value.trim();


  const description=
    document
      .getElementById("requestDescription")
      .value.trim();


  if(!address){

    showMessage(
      "requestMessage",
      "Address / Area zaroori hai",
      true
    );

    return;
  }


  showMessage(
    "requestMessage",
    "Request bheji ja rahi hai..."
  );


  try{

    const response=
      await fetch(
        API_BASE+"/api/requests",
        {
          method:"POST",

          headers:authHeaders(),

          body:JSON.stringify({

            customer_name:
              currentUser.name ||
              currentUser.full_name,

            phone:
              currentUser.phone,

            service:
              selectedService,

            address:
              address,

            description:
              description

          })

        }
      );


    const data=
      await response.json();


    if(!response.ok || !data.success){

      showMessage(
        "requestMessage",
        data.message || "Request failed",
        true
      );

      return;
    }


    showMessage(
      "requestMessage",
      "✅ Request successfully bhej di gayi!"
    );


    document
      .getElementById("requestDescription")
      .value="";


    document
      .getElementById("requestAddress")
      .value="";


    selectedService="";

    document
      .querySelectorAll(".service-btn")
      .forEach(
        btn=>btn.classList.remove("selected")
      );


    loadCustomerRequests();


  }catch(error){

    console.error(error);

    showMessage(
      "requestMessage",
      "Server error. Dobara try karein.",
      true
    );

  }

}


/* =====================================================
   CUSTOMER REQUESTS
===================================================== */

async function loadCustomerRequests(){

  if(!currentUser){
    return;
  }


  try{

    const response=
      await fetch(
        API_BASE+
        "/api/customer/requests/"+
        currentUser.id,
        {
          method:"GET",
          headers:authHeaders()
        }
      );


    const data=
      await response.json();


    const box=
      document.getElementById(
        "customerRequests"
      );


    if(response.status===401){

      box.innerHTML=
        "<p>Session expire ho gaya. Dobara login karein.</p>";

      return;
    }


    if(!data.success){

      box.innerHTML=
        "<p>Requests load nahi hui.</p>";

      return;
    }


    if(
      !data.requests ||
      data.requests.length===0
    ){

      box.innerHTML=
        "<p>Abhi koi request nahi hai.</p>";

      return;
    }


    box.innerHTML=
      data.requests
      .map(request=>`

        <div class="request">

          <b>
            🔧
            ${escapeHtml(
              request.service ||
              "Service"
            )}
          </b>

          <p>
            📍
            ${escapeHtml(
              request.address ||
              "Address nahi hai"
            )}
          </p>

          <p>
            Problem:
            ${escapeHtml(
              request.description ||
              request.details ||
              "Not provided"
            )}
          </p>

          <p>
            Status:
            <span class="status">
              ${escapeHtml(
                request.status ||
                "New"
              )}
            </span>
          </p>

        </div>

      `)
      .join("");


  }catch(error){

    console.error(error);

    document
      .getElementById("customerRequests")
      .innerHTML=
        "<p>Requests load nahi hui.</p>";

  }

}


/* =====================================================
   KARIGAR REQUESTS
===================================================== */

async function loadRequests(){

  if(!currentUser || currentUser.role!=="karigar"){
    return;
  }


  try{

    const response=
      await fetch(
        API_BASE+"/api/requests",
        {
          method:"GET",
          headers:authHeaders()
        }
      );


    const data=
      await response.json();


    if(response.status===401){

      showMessage(
        "karigarMessage",
        "Session expire ho gaya. Dobara login karein.",
        true
      );

      return;
    }


    if(!response.ok || !data.success){

      showMessage(
        "karigarMessage",
        data.message || "Requests load nahi hui",
        true
      );

      return;
    }


    const requests=
      data.requests || [];


    document
      .getElementById("totalRequests")
      .textContent=
        requests.length;


    document
      .getElementById("newRequests")
      .textContent=
        requests.filter(
          r=>r.status==="New"
        ).length;


    document
      .getElementById("completedRequests")
      .textContent=
        requests.filter(
          r=>r.status==="Completed" &&
          r.karigar_id===currentUser.id
        ).length;


    const box=
      document.getElementById(
        "requestsList"
      );


    if(requests.length===0){

      box.innerHTML=
        "<p>Abhi koi service request nahi hai.</p>";

      return;
    }


    box.innerHTML=
      requests
      .map(request=>{

        let buttons="";

        if(request.status==="New"){

          buttons=`
            <button
              class="primary"
              onclick="updateStatus(${request.id},'Accepted')"
            >
              Accept
            </button>
          `;

        }else if(
          request.karigar_id===currentUser.id &&
          request.status==="Accepted"
        ){

          buttons=`
            <button
              class="warning"
              onclick="updateStatus(${request.id},'On The Way')"
            >
              On The Way
            </button>
          `;

        }else if(
          request.karigar_id===currentUser.id &&
          request.status==="On The Way"
        ){

          buttons=`
            <button
              class="secondary"
              onclick="updateStatus(${request.id},'Working')"
            >
              Working
            </button>
          `;

        }else if(
          request.karigar_id===currentUser.id &&
          request.status==="Working"
        ){

          buttons=`
            <button
              class="success"
              onclick="updateStatus(${request.id},'Completed')"
            >
              Completed
            </button>
          `;

        }


        return `

        <div class="request">

          <b>
            #${request.id}
            —
            ${escapeHtml(
              request.service ||
              "Service"
            )}
          </b>

          <p>
            👤 Customer:
            ${escapeHtml(
              request.customer_name ||
              request.name ||
              "Not provided"
            )}
          </p>

          <p>
            📱 Mobile:
            ${escapeHtml(
              request.phone ||
              "Not provided"
            )}
          </p>

          <p>
            📍 Location:
            ${escapeHtml(
              request.address ||
              request.location ||
              "Not provided"
            )}
          </p>

          <p>
            📝 Problem:
            ${escapeHtml(
              request.description ||
              request.details ||
              "Not provided"
            )}
          </p>

          <p>
            Status:
            <span class="status">
              ${escapeHtml(
                request.status ||
                "New"
              )}
            </span>
          </p>

          ${request.karigar_id
            ? `
              <p style="font-size:13px;color:#666;">
                🛠️ Request assigned
              </p>
            `
            : ""
          }

          <div>
            ${buttons}
          </div>

        </div>

        `;

      })
      .join("");


  }catch(error){

    console.error(error);

    showMessage(
      "karigarMessage",
      "Server se connection nahi ho raha",
      true
    );

  }

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateStatus(id,status){

  if(!getToken()){

    alert(
      "Session expire ho gaya. Dobara login karein."
    );

    return;
  }


  /*
    Frontend safety:
    Cancel intentionally blocked.
  */

  if(status==="Cancelled"){

    alert(
      "❌ Karigar request Cancel nahi kar sakta."
    );

    return;
  }


  try{

    const response=
      await fetch(
        API_BASE+
        "/api/requests/"+
        id+
        "/status",
        {
          method:"PUT",

          headers:authHeaders(),

          body:JSON.stringify({
            status:status
          })

        }
      );


    const data=
      await response.json();


    if(!response.ok || !data.success){

      alert(
        data.message ||
        "Status update failed"
      );

      return;
    }


    loadRequests();


  }catch(error){

    console.error(error);

    alert(
      "Server error"
    );

  }

}


/* =====================================================
   CURRENT LOCATION
===================================================== */

function getCurrentLocation(){

  if(!navigator.geolocation){

    alert(
      "Aapke browser me location support nahi hai."
    );

    return;
  }


  if(!getToken()){

    alert(
      "Pehle login karein."
    );

    return;
  }


  alert(
    "Location permission Allow karein."
  );


  navigator.geolocation.getCurrentPosition(

    async function(position){

      const latitude=
        position.coords.latitude;

      const longitude=
        position.coords.longitude;


      let locationText=
        "Current Location";


      try{

        const geoResponse=
          await fetch(
            "https://nominatim.openstreetmap.org/reverse?format=json&lat="+
            latitude+
            "&lon="+
            longitude+
            "&zoom=10&addressdetails=1",
            {
              headers:{
                "Accept":
                  "application/json"
              }
            }
          );


        const geoData=
          await geoResponse.json();


        locationText=
          geoData.display_name ||
          "Current Location";


      }catch(error){

        locationText=
          "Current Location";

      }


      if(currentUser){

        try{

          const response=
            await fetch(
              API_BASE+
              "/api/profile/"+
              currentUser.id+
              "/location",
              {
                method:"PUT",

                headers:authHeaders(),

                body:JSON.stringify({

                  latitude:
                    latitude,

                  longitude:
                    longitude,

                  location:
                    locationText,

                  state:""

                })

              }
            );


          const data=
            await response.json();


          if(data.success){

            currentUser=
              data.profile;


            localStorage.setItem(
              "heyKarigarProfile",
              JSON.stringify(
                currentUser
              )
            );


            showLoggedInUser();


            alert(
              "✅ Location update ho gayi."
            );


          }else{

            alert(
              data.message ||
              "Location update nahi hui."
            );

          }


        }catch(error){

          console.error(error);

          alert(
            "Location server par save nahi hui."
          );

        }

      }

    },


    function(error){

      console.error(error);

      alert(
        "Location permission nahi mili. Browser me location Allow karein."
      );

    },


    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   AUTO LOGIN
===================================================== */

try{

  const savedProfile=
    localStorage.getItem(
      "heyKarigarProfile"
    );

  const savedToken=
    localStorage.getItem(
      "heyKarigarToken"
    );


  if(savedProfile && savedToken){

    currentUser=
      JSON.parse(savedProfile);

    showLoggedInUser();

  }

}catch(error){

  console.error(error);

  localStorage.removeItem(
    "heyKarigarProfile"
  );

  localStorage.removeItem(
    "heyKarigarToken"
  );

  localStorage.removeItem(
    "heyKarigarRefreshToken"
  );

}
