<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hey Karigar - Local Services</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f6;
      color: #17221c;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: .95;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
    }

    .welcome h2 {
      margin-bottom: 8px;
      font-size: 22px;
    }

    .search {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-top: 15px;
      outline: none;
    }

    .section-title {
      margin: 20px 2px 12px;
      font-size: 21px;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .service {
      background: white;
      border: 0;
      border-radius: 16px;
      padding: 18px 8px;
      text-align: center;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
      color: #17221c;
      transition: .15s;
    }

    .service:active {
      transform: scale(.96);
    }

    .service-icon {
      display: block;
      font-size: 32px;
      margin-bottom: 9px;
    }

    .request-box {
      display: none;
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    .request-box h2 {
      margin-bottom: 15px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn.secondary {
      background: #555;
      margin-top: 9px;
    }

    .success {
      display: none;
      background: #e7f8ef;
      color: #176b3a;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .empty {
      display: none;
      background: white;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      color: #777;
    }

      text-align: center;
      padding: 28px 10px
